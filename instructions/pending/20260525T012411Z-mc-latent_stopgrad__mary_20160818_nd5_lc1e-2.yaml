kind: mindcontrol

# Single-cell loop-closure-detach test on the latent_norm_test baseline
# recipe (n_delays=5, loop_closure_weight=1.0e-2) on
# Mary-Anesthesia-20160818-02. Pinned into the original latent_norm_test
# wandb_group so this run appears as a fourth controlled variant
# alongside {baseline, emanorm, percond_dyn}.
#
# Differs from the original baseline cell ONLY in the underlying
# JacobianODE code: commit 84008ee5 detaches z_dyn before
# loop_closure_model_step (training only), so loop_closure_loss
# backpropagates into the Jacobian network's parameters but not into
# the encoder. The previous latent-pred-target detach (4ce6bbe5) has
# been reverted -- the only change in 84008ee5 vs the latent_norm_test
# baseline is the loop-closure encoder cut.

metadata:
  description: >
    Single cell on Mary-Anesthesia-20160818-02 with the latent_norm_test
    BASELINE recipe (production encoder hidden_dim=1024,
    n_coupling_layers=16; [2048,2048,4096,4096] dynamics MLP; n_delays=5;
    loop_closure_weight=1.0e-2; 20-epoch fixed horizon). The only delta
    from the baseline cell is that loop_closure_loss is detached from
    the encoder (z_dyn.detach() into loop_closure_model_step).
    Submitted to ou_bcs_high.
  hypothesis: |
    Loop closure is a STRUCTURAL property of any honest Jacobian — the
    pushforward of a row-conservative field under any smooth
    diffeomorphism is itself row-conservative. With z_dyn carrying
    gradients into loop_closure_loss, the encoder is implicitly
    co-optimized to reshape latent geometry into coordinates where
    J(z) is more easily made conservative. That co-optimization channel
    is theoretically distinct from the encoder's primary jobs
    (decoded prediction + reconstruction) and likely contributes to
    near-constant Jacobians on this session (val/jac_temporal_cv ~ 1e-5)
    by collapsing latent dynamics toward already-conservative coords.
    Detaching cuts the channel: J alone has to be conservative on E's
    geometry. Expectations: val/jac_temporal_cv rises closer to the
    emanorm cell; val/loop_closure_loss likely larger (J alone bears
    the burden); trajectory val_loss should be in a similar ballpark
    to baseline but not better.
  success_criteria:
    - 1 cell runs to 20 epochs (or TIMEOUT) within the SLURM cap.
    - val/one_step_mase finite.
    - val/jac_temporal_cv logged each val epoch (comparable to baseline cell).
    - val/loop_closure_loss logged each val epoch (likely materially higher
      than baseline).
    - val/latent_pred_loss curve approximately matches baseline (the
      latent-pred-target detach from 4ce6bbe5 is reverted; only delta
      from baseline is the loop-closure encoder cut).

dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160818-02__awake_maint__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160818-02
    sections: [awake, "maintenance dose"]
    section_condition_values: [-1.0, 1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 1

sweep_name: latent_stopgrad_loop__mary_20160818_nd5_lc1e-2

# Pin to the existing latent_norm_test wandb_group so the new cell lands
# as a 4th variant alongside {baseline, emanorm, percond_dyn}.
wandb_group: mary_propofol_resting__Mary-Anesthesia-20160818-02__awake_maint__ds1__latent_norm_test__mary_2016081__9d6560dc__20260522T000515Z

wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting

grid:
  variant:
    - {_label: stopgrad_loop,
       lightning_kwargs: {reconstruction_mode: uniform, loop_closure_weight: 1.0e-2}}

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 16
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  dynamics_kwargs:
    hidden_dim: [2048, 2048, 4096, 4096]
    num_layers: 4

  # Chosen-run hyperparameters for this session, held fixed (match
  # latent_norm_test shared_kwargs).
  n_delays: 5
  delay_spacing: 1

  n_target_dim_method: pca
  n_target_var_threshold: 0.99
  pre_pca_per_area: false
  pre_pca_var_threshold: 0.99
  whiten_after_pre_pca: false
  encoder_warmup_epochs: 0
  decoded_only_pred_loss: false

  seq_length: 25
  seq_spacing: 15
  prediction_steps: 10

  filter_data: true
  low_pass: 80.0

  normalize: true
  normalize_per_condition: true
  section_condition_values: [-1.0, 1.0]

  per_source_dynamics: false

  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  # 20-epoch controlled comparison: min_epochs=20 prevents early stop,
  # matching the latent_norm_test horizon.
  n_epochs: 20
  batch_size: 16
  seed: 42

  early_stopping_kwargs:
    early_stopping_patience: 25
    min_epochs: 20

  cfg_overrides:
    "training.trainer_params.accumulate_grad_batches": 1

slurm:
  # ou_bcs_high: 4h walltime cap.
  partition: ou_bcs_high
  cpus_per_task: 2
  mem: 128GB
  timeout_min: 240
  gres: gpu:1
  exclude_nodes: node1802,node3808
  migrate_to: mit_normal_gpu


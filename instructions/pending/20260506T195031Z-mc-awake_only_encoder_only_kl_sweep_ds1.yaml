kind: mindcontrol

# DS1 (no downsampling) version: Encoder-only (no dynamics) sweep over kl_dyn_weight to test whether
# VAE-style sampling noise in the latent space helps reconstruction
# converge below the ~0.02 floor we've been hitting on the parent
# ndelays_x_warmup sweep.
#
# encoder_only_mode skips dynamics entirely. We're isolating the
# variational encoder/decoder reconstruction problem from the much
# harder forecast problem.

metadata:
  description: >
    Encoder-only VAE-style sweep over kl_dyn_weight. Awake-only,
    n_delays=5, dt=1ms (RAW). 4 kl values to span 4 orders
    of magnitude.
  hypothesis: |
    Reconstruction loss won't drop below 0.02 on the parent sweep.
    One hypothesis: the encoder's deterministic latent makes the
    decode unstable for the high-D obs space (1245-D). Adding KL
    regularisation (use_vae=True + kl_dyn_weight > 0) injects
    Gaussian noise during forward, which can act as a smoothness
    regulariser on the encoder map and improve generalisation.

    Sweeping kl_dyn_weight ∈ {1e-4, 1e-3, 1e-2, 1e-1} spans noise
    levels from ~zero (basically deterministic) to dominant. At least
    one of these should land reconstruction loss below 0.005.

    encoder_only_mode=True skips the dynamics MLP entirely, so we
    isolate the encoder/decoder problem from the much harder
    forecast problem.
  success_criteria:
    - At least one cell achieves reconstruction loss < 0.005 within
      30 epochs.
    - Reconstruction loss is monotone in kl_dyn_weight at the chosen
      operating point (consistent with KL acting as a regulariser
      with a sweet spot, not just noise injection).

dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections: [awake]
    section_condition_values: [-1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true


sweep_name: enc_only_kl_sweep_ds1

wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting

# Dotted grid keys are forwarded directly to cfg_overrides by
# sweep_cell._promote_cfg_keys. Sweeps the cfg.training.lightning
# field directly without needing to reshape shared_kwargs.
grid:
  "training.lightning.kl_dyn_weight": [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 8
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30          # ignored in encoder_only_mode but cfg validation needs it

  n_delays: 5
  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15

  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  n_epochs: 100
  batch_size: 16
  seed: 42

  lightning_kwargs:
    reconstruction_mode: uniform     # encoder-only loss = uniform-mode recon

  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 20

  cfg_overrides:
    # encoder_only_mode: True → skip dynamics; just train encoder/decoder
    "model.encoder_only_mode": true
    # use_vae=True → reparameterize z_dyn during forward (mu + std*eps).
    # Without this, kl_dyn_weight has no signal to act on.
    "model.use_vae": true
    # accumulate_grad_batches=1 (more SGD steps per epoch).
    "training.trainer_params.accumulate_grad_batches": 1

slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 64GB
  timeout_min: 360
  gres: gpu:1


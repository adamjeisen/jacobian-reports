kind: mindcontrol

# Pilot nd sweep: MrJones-Anesthesia-20160301-01 (end (11th of 11)). Sibling of the
# Mary-20160831 + MrJones-20160105 sweeps. Confirms whether the
# nd ∈ {5,10,15} sweet-spot generalizes across sessions.

metadata:
  description: >
    14 cells on MrJones-Anesthesia-20160301-01 (end (11th of 11) —
    2016-03-01, last MrJones recording day). Grid: n_delays ∈ {1, 5, 10, 15, 20, 25, 30},
    n_target_var_threshold ∈ {0.99, 0.95}, ds=1. Identical config to the
    other nd pilots. 6h SLURM cap with migrate_to=mit_normal_gpu.
  hypothesis: |
    Same as the other nd pilots — expect top-3 nd at nt=0.99 to fall in
    {5, 10, 15} (which is what Mary-20160809 + MrJones-20160105 both
    show). If the sweet-spot drifts on a late-recording session, that's
    important to know before committing to the LC×nd sweep on the rest.
  success_criteria:
    - All 14 cells run within the 6-hour SLURM cap (or TIMEOUT).
    - val/one_step_mase finite for all cells.
    - Top-3 n_delays at nt=0.99 fall within {5, 10, 15, 20}.

dataset:
  name: mrjones_propofol_resting__MrJones-Anesthesia-20160301-01__awake_maint__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: MrJones-Anesthesia-20160301-01
    sections: [awake, "maintenance dose"]
    section_condition_values: [-1.0, 1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 1

sweep_name: nopre_decF_w0_pred10__mrjones_20160301_ndelays_x_nt

wandb_entity: JacobianODE
wandb_project: MindControl_MrJones_propofol_resting

grid:
  n_delays: [1, 5, 10, 15, 20, 25, 30]
  n_target_var_threshold: [0.99, 0.95]

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 16
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  dynamics_kwargs:
    hidden_dim: [2048, 2048, 4096, 4096]
    num_layers: 4

  delay_spacing: 1
  n_target_dim_method: pca
  pre_pca_per_area: false
  pre_pca_var_threshold: 0.99
  whiten_after_pre_pca: false
  encoder_warmup_epochs: 0
  decoded_only_pred_loss: false

  seq_length: 25
  seq_spacing: 15
  prediction_steps: 10

  filter_data: true
  low_pass: 80.0

  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  section_condition_values: [-1.0, 1.0]

  per_source_dynamics: false

  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  n_epochs: 100
  batch_size: 16
  seed: 42

  lightning_kwargs:
    reconstruction_mode: uniform

  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 15

  cfg_overrides:
    "training.trainer_params.accumulate_grad_batches": 1

slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 128GB
  timeout_min: 360
  gres: gpu:1
  exclude_nodes: node1802,node3808
  migrate_to: mit_normal_gpu


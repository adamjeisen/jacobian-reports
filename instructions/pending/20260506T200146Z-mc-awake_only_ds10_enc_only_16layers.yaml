kind: mindcontrol

# Single-cell expressivity test: 16 coupling layers (vs 8 in the parent
# sweep + KL sweep) — same recipe otherwise. Encoder-only, no VAE,
# ds10 awake-only. Tests whether the reconstruction floor of ~0.02 is
# a capacity issue (more layers should help) or a structural one
# (more layers won't help).

metadata:
  description: >
    Single-cell encoder-only run with double the coupling depth
    (n_coupling_layers=16) on ds10 awake-only. No VAE noise, no
    dynamics. Pure deterministic autoencoder bake-off vs the 8-layer
    baseline.
  hypothesis: |
    Doubling n_coupling_layers (8 → 16) gives the encoder roughly
    twice the depth — each AdditiveCouplingLayer is a residual update
    on half the channels, so 16 layers means each channel is updated
    8 times instead of 4 in the forward direction. If reconstruction
    loss drops well below 0.02 on this run, the previous floor was a
    capacity issue and the natural next step is bigger encoders. If
    it stays at ~0.02, the bottleneck is structural (additive coupling
    geometry, fixed split, etc.) and we should look at affine coupling
    or different layer types.
  success_criteria:
    - Reconstruction loss drops below 0.005 within 30 epochs.
    - The descent rate (loss vs epoch) is monotone — no oscillation
      or instability that we'd see if depth was over-regularising.

dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only__ds10
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections: [awake]
    section_condition_values: [-1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 10

sweep_name: enc_only_16layers

wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting

# Single cell — no grid.
grid: {}

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 16          # ← doubled vs the parent sweep
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30          # ignored under encoder_only_mode but cfg validation reads it

  n_delays: 5
  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15

  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  n_epochs: 100
  batch_size: 16
  seed: 42

  lightning_kwargs:
    reconstruction_mode: uniform

  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 20

  cfg_overrides:
    "model.encoder_only_mode": true
    "model.use_vae": false                                          # explicit: deterministic encoder, no KL term
    "training.trainer_params.accumulate_grad_batches": 1

slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 64GB
  timeout_min: 360
  gres: gpu:1


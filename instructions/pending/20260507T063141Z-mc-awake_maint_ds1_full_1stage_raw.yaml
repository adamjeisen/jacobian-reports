kind: mindcontrol

# 24-run filter × prediction × var-threshold sweep — Sweep A (single-stage,
# RAW, no LPF). 6 cells: prediction_steps {30, 50} × n_target_var_threshold
# {0.99, 0.95, 0.90}. Companion to:
#   - awake_maint_ds1_full_1stage_lp100  (same grid + LPF 100 Hz)
#   - awake_maint_ds1_full_2stage_raw    (two-stage PCA equivalent)
#   - awake_maint_ds1_full_2stage_lp100  (two-stage PCA + LPF 100 Hz)
# All four together = 24 runs.

metadata:
  description: >
    ds=1 (1000 Hz raw), n_delays=5, awake + maintenance dose. Single-
    stage PCA autodim. RAW (no low-pass filtering). 6 cells over
    prediction_steps × n_target_var_threshold.
  hypothesis: |
    Reference arm (no filter, single-stage PCA) for the 24-run sweep
    that varies (filter ∈ {raw, LPF 100Hz}) × (prediction_steps ∈ {30, 50})
    × (var threshold ∈ {.99, .95, .90}). Joint with the LPF 100 Hz
    arm we'll see whether filtering helps at the high-threshold (raw-
    spectrum-dependent) or low-threshold (variance-floor-dependent)
    end of the autodim picks.
  success_criteria:
    - All 6 cells finish within the 3-hour SLURM cap.
    - val/one_step_mase finite for all cells.
    - Higher prediction_steps degrades free-running r² but not the
      Jacobian/Lyapunov estimates.

dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_maint__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections: [awake, "maintenance dose"]
    section_condition_values: [-1.0, 1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 1

sweep_name: full_1stage_raw_ds1

wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting

grid:
  prediction_steps: [30, 50]
  n_target_var_threshold: [0.99, 0.95, 0.90]

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 16
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  dynamics_kwargs:
    hidden_dim: [2048, 2048, 4096, 4096]
    num_layers: 4

  n_target_dim_method: pca

  n_delays: 5
  delay_spacing: 1
  seq_length: 80              # ≥ traj_init_steps (15) + max prediction_steps (50) + a margin
  seq_spacing: 15

  # filtering OFF for this arm
  filter_data: false

  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true

  # single-stage PCA: skip pre-PCA reduction
  pre_pca_per_area: false

  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  n_epochs: 100
  batch_size: 4               # smaller than ds10 (4 vs 16) — trajectories are 10× longer at ds=1
  seed: 42

  lightning_kwargs:
    reconstruction_mode: uniform

  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 15

  cfg_overrides:
    "training.trainer_params.accumulate_grad_batches": 1

slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 128GB                  # 4× the ds10 budget — bigger buffers at ds=1
  timeout_min: 180            # user-requested 3 hours
  gres: gpu:1


kind: mindcontrol

# Falsification test for the per-area pre-PCA hypothesis.
# Same recipe as awake_only_baseline.yaml, but adds
# pre_pca_per_area=True so the encoder/dynamics learn over a
# 60-component per-area-reduced input rather than the 249 raw channels.
# At n_delays=5 this drops the second-stage autodim from ~73 to ~42
# (per the diagnostic in mindcontrol/diagnostics/per_area_pca_pipeline).

metadata:
  description: >
    Awake-only single-cell test of pre_pca_per_area=True. Tests the
    hypothesis that the parent sweep's reconstruction-loss-floor +
    one_step_mase ≥ 1 problem stems from the encoder needing to span
    too many redundant raw channels.
  hypothesis: |
    Per-area PCA at 99% drops Mary 7b from 64 → 7 channels, vlPFC
    from 61 → 8, FEF 61 → 18, CPB 63 → 27 (total 249 → 60). With this
    pre-reduction, the encoder's coupling layers operate on a 60-dim
    × n_delays=5 = 300-dim input space (vs the 1245-dim raw-input
    case), and the second-stage autodim drops to ~42 dims. The
    encoder + dynamics MLP should then converge to a much lower
    reconstruction loss faster, and one_step_mase should clearly
    drop below 1.0.

    If reconstruction loss < 0.005 within 30 epochs and one_step_mase
    finishes below 0.9, the pre-PCA hypothesis is validated and we
    promote it to the parent sweep recipe.
  success_criteria:
    - Reconstruction loss drops below 0.005 within 30 epochs.
    - val/one_step_mase finishes below 0.9 (clearly beats persistence).
    - Per-area autodim picks lands close to the diagnostic's prediction
      (~42 total dims at n_delays=5 with pre_pca_var_threshold=0.99).

dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections: [awake]
    section_condition_values: [-1.0]
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true

sweep_name: awake_only_pre_pca

wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting

grid: {}    # single cell

shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 8
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3

  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30

  n_delays: 5
  encoder_warmup_epochs: 0

  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15

  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true

  # ---- The new knob ----
  pre_pca_per_area: true
  pre_pca_var_threshold: 0.99

  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory

  n_epochs: 100
  batch_size: 16
  seed: 42

  lightning_kwargs:
    reconstruction_mode: uniform

  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 20

  # Override cfg.training.trainer_params.accumulate_grad_batches: 4 → 1
  # to take 4× more gradient steps per epoch.
  cfg_overrides:
    training.trainer_params.accumulate_grad_batches: 1

slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 64GB           # smaller pre-PCA'd input → less host RAM needed
  timeout_min: 360
  gres: gpu:1


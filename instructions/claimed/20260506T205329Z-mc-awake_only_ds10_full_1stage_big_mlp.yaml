kind: mindcontrol
metadata:
  description: 'Full training: 16-layer encoder + dynamics MLP [2048, 2048, 4096,
    4096] on awake-only ds10. Single-stage PCA (no pre_pca_per_area). JacobianODE
    autodim picks ~73 dynamic dims from the 1245-dim delay-embedded obs at PCA-99%.
    15 encoder warmup epochs.

    '
  hypothesis: "Same as the two-stage variant. The single-stage version gives the\n\
    encoder more raw input dimensions to work with (1245 vs ~300\nafter two-stage\
    \ pre-PCA). Net dynamic latent ~73 vs ~42.\n\nComparing to the two-stage variant\
    \ tells us whether the upstream\nper-area PCA reduction throws away dynamics-relevant\
    \ variance \u2014\nif single-stage forecasts noticeably better, the raw delay-\n\
    embedded obs has structure that pre-PCA was discarding.\n"
  success_criteria:
  - Reconstruction loss tracks the encoder-only convergence in the first 15 epochs
    (~0.01 floor at PCA-99%, awake-only).
  - val/one_step_mase drops below 1.0 (model beats persistence) by epoch 60.
  - "val/total_loss is monotonically decreasing across the warmup \u2192 dynamics\
    \ transition (no divergence at epoch 15+)."
dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only__ds10
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections:
    - awake
    section_condition_values:
    - -1.0
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 10
sweep_name: full_1stage_big_mlp
wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting
grid: {}
shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 16
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 0.001
  dynamics_kwargs:
    hidden_dim:
    - 2048
    - 2048
    - 4096
    - 4096
    num_layers: 4
  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30
  n_delays: 5
  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15
  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  pre_pca_per_area: false
  pre_pca_var_threshold: 0.99
  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory
  n_epochs: 100
  batch_size: 16
  seed: 42
  encoder_warmup_epochs: 15
  lightning_kwargs:
    reconstruction_mode: uniform
  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 30
  cfg_overrides:
    training.trainer_params.accumulate_grad_batches: 1
slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 96GB
  timeout_min: 360
  gres: gpu:1

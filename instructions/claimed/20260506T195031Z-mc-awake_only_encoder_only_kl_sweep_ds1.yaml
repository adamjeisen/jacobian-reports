kind: mindcontrol
metadata:
  description: 'Encoder-only VAE-style sweep over kl_dyn_weight. Awake-only, n_delays=5,
    dt=1ms (RAW). 4 kl values to span 4 orders of magnitude.

    '
  hypothesis: "Reconstruction loss won't drop below 0.02 on the parent sweep.\nOne\
    \ hypothesis: the encoder's deterministic latent makes the\ndecode unstable for\
    \ the high-D obs space (1245-D). Adding KL\nregularisation (use_vae=True + kl_dyn_weight\
    \ > 0) injects\nGaussian noise during forward, which can act as a smoothness\n\
    regulariser on the encoder map and improve generalisation.\n\nSweeping kl_dyn_weight\
    \ \u2208 {1e-4, 1e-3, 1e-2, 1e-1} spans noise\nlevels from ~zero (basically deterministic)\
    \ to dominant. At least\none of these should land reconstruction loss below 0.005.\n\
    \nencoder_only_mode=True skips the dynamics MLP entirely, so we\nisolate the encoder/decoder\
    \ problem from the much harder\nforecast problem.\n"
  success_criteria:
  - At least one cell achieves reconstruction loss < 0.005 within 30 epochs.
  - Reconstruction loss is monotone in kl_dyn_weight at the chosen operating point
    (consistent with KL acting as a regulariser with a sweet spot, not just noise
    injection).
dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections:
    - awake
    section_condition_values:
    - -1.0
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
sweep_name: enc_only_kl_sweep_ds1
wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting
grid:
  training.lightning.kl_dyn_weight:
  - 0.0001
  - 0.001
  - 0.01
  - 0.1
shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 8
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 0.001
  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30
  n_delays: 5
  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15
  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory
  n_epochs: 100
  batch_size: 16
  seed: 42
  lightning_kwargs:
    reconstruction_mode: uniform
  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 20
  cfg_overrides:
    model.encoder_only_mode: true
    model.use_vae: true
    training.trainer_params.accumulate_grad_batches: 1
slurm:
  partition: ou_bcs_normal
  cpus_per_task: 2
  mem: 64GB
  timeout_min: 360
  gres: gpu:1

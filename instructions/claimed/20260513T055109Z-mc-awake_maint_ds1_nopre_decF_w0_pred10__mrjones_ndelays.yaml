kind: mindcontrol
metadata:
  description: "14 cells on MrJones-Anesthesia-20160105-01 (chosen as a sample MrJones\
    \ propofol session; out of 11 available). Grid: n_delays \u2208 {1, 5, 10, 15,\
    \ 20, 25, 30}, n_target_var_threshold \u2208 {0.99, 0.95}. delay_spacing fixed\
    \ at 1 (no ds=5/10 this time). Other knobs match the prior Mary nopre+pred10 baseline:\
    \ pre_pca_per_area=false, decoded_only_pred_loss=False, encoder_warmup_epochs=0,\
    \ batch_size=16, prediction_steps=10, seq_length=25, lp=80 Hz, awake + maintenance\
    \ dose, lc=0, obs_noise_scale=0. With migrate_to=mit_normal_gpu so the heavier\
    \ cells move to mit_normal_gpu when the QOS budget allows.\n"
  hypothesis: "The ndelays \xD7 nt sweet-spot for the JacobianODE on Mary propofol\n\
    LFP was nd\u22485\u201315 at nt=0.99 and nd\u224810\u201320 at nt=0.95. We expect\
    \ a\nsimilar pattern on MrJones \u2014 that is, the optimum n_delays should\n\
    shift with nt and depend modestly on the recording, but the broad\nshape (concave\
    \ w.r.t. n_delays) should hold across subjects.\n"
  success_criteria:
  - All 14 cells run within the 6-hour SLURM cap (or TIMEOUT).
  - val/one_step_mase finite for all cells.
  - At least one (nt, n_delays) cell strictly beats the (nt, n_delays=1) baseline
    on best trajectory val_loss for both nt values.

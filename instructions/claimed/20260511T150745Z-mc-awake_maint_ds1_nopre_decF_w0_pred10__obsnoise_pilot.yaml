kind: mindcontrol
metadata:
  description: "12 cells: 6 (n_target_var_threshold, n_delays) bundles \xD7 2 obs_noise.\
    \ nt99 uses n_delays \u2208 {5, 10, 15}, nt95 uses {10, 15, 20} \u2014 top-3 per\
    \ nt by trajectory val_loss from the prior nopre+pred10 ds\xD7nd sweeps. obs_noise\
    \ \u2208 {0.01, 0.05}; obs_noise=0 baselines already exist in the prior groups\
    \ (nt99: \u2026__nde__9637ce59\u2026, nt95: \u2026__nde__8388b216\u2026) \u2014\
    \ compare against those rather than re-running. Other knobs match prior nopre+pred10\
    \ baseline: pre_pca_per_area=false, decoded_only_pred_loss=False, encoder_warmup_epochs=0,\
    \ batch_size=16, delay_spacing=1, prediction_steps=10, seq_length=25, lp=80 Hz,\
    \ awake + maintenance.\n"
  hypothesis: "Observation noise during training acts as a regularizer in the\nencoder\
    \ + dynamics composition: it forces the latent to be robust\nto small input perturbations.\
    \ If the prior nopre+pred10 baselines\nare limited by encoder overfitting / brittle\
    \ latents, obs_noise\n> 0 should improve trajectory val_loss (and lower one_step_mase).\n\
    If they're not \u2014 e.g. if the bottleneck is dynamics-MLP capacity\nor the\
    \ autodim'd latent \u2014 obs_noise will be neutral or slightly\nharmful. We test\
    \ 0.01 and 0.05 to span \"barely perceptible\" and\n\"visibly perturbing\" noise\
    \ levels.\n"
  success_criteria:
  - All 12 cells run within the 6-hour SLURM cap (or TIMEOUT).
  - val/one_step_mase finite for all cells.
  - "For at least one (nt, n_delays) bundle, obs_noise > 0 strictly beats the corresponding\
    \ obs_noise = 0 cell from the prior nopre ds\xD7nd sweeps on best trajectory val_loss.\
    \ If not, drop the obs_noise axis from the next sweep."

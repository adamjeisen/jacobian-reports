kind: mindcontrol
metadata:
  description: 'Single cell on Mary-Anesthesia-20160818-02, fixed at n_delays=5 and
    loop_closure_weight=1.0e-2 (the chosen-run hyperparameters and the baseline cell
    of the latent_norm_test 3-run sweep). All other knobs identical to the smallenc_lcxnd__mary_20160818
    production sweep (128-d, 8-layer encoder, [2048,2048,4096,4096] dynamics MLP,
    nopre_decF_w0_nt99_pred10). Pinned to the existing smallenc_lcxnd wandb_group
    so this run is directly comparable to its baseline cell. Submitted to ou_bcs_high
    partition.

    '
  hypothesis: 'The original smallenc_lcxnd run trained without a stop-gradient on

    the latent-prediction target, so latent_pred_loss updated the

    encoder via both arms of the loss (z_pred AND z_true). This is the

    canonical representation-collapse shape and may have contributed

    to the observed near-linearity of the learned Jacobians

    (jac_temporal_cv ~ 0 at chosen lc on this session). With the

    detach in place, latent_pred_loss only flows into the encoder

    through the z_pred (rollout) path. Expectation: latent_pred_loss

    curve differs from the baseline; jac_temporal_cv may rise;

    trajectory val_loss should be in a similar ballpark.

    '
  success_criteria:
  - 1 cell runs to early stopping or the 6h SLURM cap.
  - val/one_step_mase finite for the cell.
  - val/latent_pred_loss logged each val epoch.
  - Compare jac_temporal_cv* between this cell and the nd=5/lc=1e-2 cell of the original
    smallenc_lcxnd group.

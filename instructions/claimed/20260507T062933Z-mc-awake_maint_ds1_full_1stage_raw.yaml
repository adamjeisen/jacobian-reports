kind: mindcontrol
metadata:
  description: "ds=1 (1000 Hz raw), n_delays=5, awake + maintenance dose. Single-\
    \ stage PCA autodim. RAW (no low-pass filtering). 6 cells over prediction_steps\
    \ \xD7 n_target_var_threshold.\n"
  hypothesis: "Reference arm (no filter, single-stage PCA) for the 24-run sweep\n\
    that varies (filter \u2208 {raw, LPF 100Hz}) \xD7 (prediction_steps \u2208 {30,\
    \ 50})\n\xD7 (var threshold \u2208 {.99, .95, .90}). Joint with the LPF 100 Hz\n\
    arm we'll see whether filtering helps at the high-threshold (raw-\nspectrum-dependent)\
    \ or low-threshold (variance-floor-dependent)\nend of the autodim picks.\n"
  success_criteria:
  - All 6 cells finish within the 3-hour SLURM cap.
  - val/one_step_mase finite for all cells.
  - "Higher prediction_steps degrades free-running r\xB2 but not the Jacobian/Lyapunov\
    \ estimates."
dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_maint__ds1
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections:
    - awake
    - maintenance dose
    section_condition_values:
    - -1.0
    - 1.0
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 1
sweep_name: full_1stage_raw_ds1
wandb_entity: JacobianODE

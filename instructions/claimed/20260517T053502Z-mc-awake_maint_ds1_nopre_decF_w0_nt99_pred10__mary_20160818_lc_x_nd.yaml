    \ sessions in the precise LC peak + late-bloom epoch\nis the whole point of running\
    \ this on more sessions.\n"
  success_criteria:
  - All 21 cells run within the 6-hour SLURM cap (or TIMEOUT).
  - val/one_step_mase finite for all cells.
  - For each n_delays, at least one lc_weight > 0 strictly beats lc_weight = 0 on
    best trajectory val_loss.

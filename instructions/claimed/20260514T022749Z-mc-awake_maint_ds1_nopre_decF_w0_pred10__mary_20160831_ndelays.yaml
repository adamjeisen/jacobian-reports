kind: mindcontrol
metadata:
  description: "7 cells on Mary-Anesthesia-20160831-02 (mid-recording \u2014 5th of\
    \ 10 Mary sessions, 2016-08-31; first session was 2016-08-09, last was 2016-09-16).\
    \ Grid: n_delays \u2208 {1, 5, 10, 15, 20, 25, 30}, fixed nt=0.99, ds=1. Identical\
    \ config to the prior MrJones nd sweep. 6-hour SLURM cap with migrate_to=mit_normal_gpu.\n"
  hypothesis: "The Mary-20160809 nd sweep gave top-3 nd\u2208{5,10,15} at nt=0.99\
    \ and\n{10,15,20} at nt=0.95. MrJones-20160105 gave the same {5,10,15}\nset at\
    \ nt=0.99. We expect Mary-20160831 to also fall in this\n{5,10,15} neighborhood,\
    \ with the exact rank possibly shifting.\nIf the top-3 set differs noticeably,\
    \ we'll know to do per-session\nnd sweeps before the bigger LC sweep.\n"
  success_criteria:
  - All 7 cells run within the 6-hour SLURM cap (or TIMEOUT).
  - val/one_step_mase finite for all cells.
  - Top-3 n_delays at nt=0.99 fall within {5, 10, 15, 20}.

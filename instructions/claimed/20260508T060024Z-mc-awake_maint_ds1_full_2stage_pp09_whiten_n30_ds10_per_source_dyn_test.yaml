kind: mindcontrol
metadata:
  description: "First test of `per_source_dynamics` (one dynamics MLP per condition,\
    \ routed by section_condition_values nearest-neighbor on c[..., 0]). Two cells:\
    \ per_source_dynamics \u2208 {false, true}; everything else pinned. pre_pca=0.9\
    \ + whiten_after_pre_pca=true; n_target_var_threshold=0.9; n_delays=30; delay_spacing=10.\n"
  hypothesis: "Burst-suppression maintenance-dose data and active awake data have\n\
    very different dynamics distributions; a single shared dynamics MLP\nis biased\
    \ toward the higher-variance / higher-gradient regime and\nunder-fits the suppressed\
    \ regime. Splitting the dynamics MLP per\ncondition (per_source_dynamics=true)\
    \ should improve val/one_step_mase\n(or its latent-only variant) on the maintenance-dose\
    \ side without\nhurting awake. Whitening + dropping pre-PCA threshold to 0.9 in\n\
    parallel \u2014 these are part of the wider preprocessing change being\nvalidated\
    \ in the same run.\n"
  success_criteria:
  - Both cells finish within the 3-hour SLURM cap.
  - val/one_step_mase finite for both cells.
  - "per_source_dynamics=true cell has model wired through PerSourceDynamicsMLP (verifiable\
    \ from cell stdout \u2014 model summary prints the wrapper)."
dataset:

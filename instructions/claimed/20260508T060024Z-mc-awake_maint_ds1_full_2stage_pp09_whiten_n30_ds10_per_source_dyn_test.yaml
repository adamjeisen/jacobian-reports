    - maintenance dose
    section_condition_values:
    - -1.0
    - 1.0
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 1
sweep_name: full_2stage_pp09_whiten_n30_ds10_per_source_dyn_test

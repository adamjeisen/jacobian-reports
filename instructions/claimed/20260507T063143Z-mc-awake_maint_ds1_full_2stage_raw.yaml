  split_by: trajectory
  n_epochs: 100
  batch_size: 4
  seed: 42
  lightning_kwargs:
    reconstruction_mode: uniform
  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 15
  cfg_overrides:

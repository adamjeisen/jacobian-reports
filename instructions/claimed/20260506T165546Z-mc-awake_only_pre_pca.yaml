kind: mindcontrol
metadata:
  description: "Awake-only single-cell test of pre_pca_per_area=True. Tests the hypothesis\
    \ that the parent sweep's reconstruction-loss-floor + one_step_mase \u2265 1 problem\
    \ stems from the encoder needing to span too many redundant raw channels.\n"
  hypothesis: "Per-area PCA at 99% drops Mary 7b from 64 \u2192 7 channels, vlPFC\n\
    from 61 \u2192 8, FEF 61 \u2192 18, CPB 63 \u2192 27 (total 249 \u2192 60). With\
    \ this\npre-reduction, the encoder's coupling layers operate on a 60-dim\n\xD7\
    \ n_delays=5 = 300-dim input space (vs the 1245-dim raw-input\ncase), and the\
    \ second-stage autodim drops to ~42 dims. The\nencoder + dynamics MLP should then\
    \ converge to a much lower\nreconstruction loss faster, and one_step_mase should\
    \ clearly\ndrop below 1.0.\n\nIf reconstruction loss < 0.005 within 30 epochs\
    \ and one_step_mase\nfinishes below 0.9, the pre-PCA hypothesis is validated and\
    \ we\npromote it to the parent sweep recipe.\n"
  success_criteria:
  - Reconstruction loss drops below 0.005 within 30 epochs.
  - val/one_step_mase finishes below 0.9 (clearly beats persistence).
  - Per-area autodim picks lands close to the diagnostic's prediction (~42 total dims
    at n_delays=5 with pre_pca_var_threshold=0.99).
dataset:
  name: mary_propofol_resting__Mary-Anesthesia-20160809-01__awake_only__ds10
  loader: mindcontrol.loaders.mary_propofol.load_resting
  loader_kwargs:
    session: Mary-Anesthesia-20160809-01
    sections:
    - awake
    section_condition_values:
    - -1.0
    min_length_sec: 3.0
    min_kept_length_sec: 1.5
    balance: true
    downsample_factor: 10
sweep_name: awake_only_pre_pca
wandb_entity: JacobianODE
wandb_project: MindControl_Mary_propofol_resting
grid: {}
shared_kwargs:
  encoder: latent_direct_sum_coupling
  encoder_kwargs:
    hidden_dim: 1024
    n_coupling_layers: 8
    use_cayley_perms: true
    final_perm_identity: true
    zero_init: true
    near_identity_std: 0.001
  n_target_var_threshold: 0.99
  n_target_dim_method: pca
  prediction_steps: 30
  n_delays: 5
  encoder_warmup_epochs: 0
  delay_spacing: 1
  seq_length: 45
  seq_spacing: 15
  obs_noise: 0.0
  normalize: true
  normalize_per_condition: true
  pre_pca_per_area: true
  pre_pca_var_threshold: 0.99
  train_percent: 0.7
  test_percent: 0.15
  split_by: trajectory
  n_epochs: 100
  batch_size: 16
  seed: 42
  lightning_kwargs:
    reconstruction_mode: uniform
  early_stopping_kwargs:
    early_stopping_patience: 5
    min_epochs: 20
  cfg_overrides:
    training.trainer_params.accumulate_grad_batches: 1

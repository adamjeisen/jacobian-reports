kind: mindcontrol
metadata:
  description: "8 base \xD7 8 fractional binary cells = 64 runs. Two n_target_var\
    \ sub-grids: 0.99 with n_delays\u2208{5,15} \xD7 delay_spacing\u2208{1,5}, and\
    \ 0.95 with n_delays\u2208{5,15} \xD7 delay_spacing\u2208{5,10}. Awake + maintenance\
    \ dose, ds=1, lp=80 Hz. New diagnostics: val/dynamics_only_one_step_mase, val/decoder_corrected_one_step_mase,\
    \ val/trajectory_pred_loss_obs, val/trajectory_pred_loss_decoded.\n"
  hypothesis: "The poor decoder reconstruction is contaminating the dynamics\ngradient\
    \ signal in the standard trajectory loss. We're testing four\nfactors at once:\n\
    \  - encoder_warmup_epochs \u2208 {0, 5}: more warmup may stabilize the\n    decoder\
    \ before turning on dynamics losses.\n  - decoded_only_pred_loss \u2208 {false,\
    \ true}: replacing the trajectory\n    target with D(z_{t+1}) (stop-grad'd) should\
    \ give f a cleaner\n    gradient by cancelling the obs-space reconstruction floor.\n\
    \  - accumulate_grad_batches \u2208 {1, 4}: effective batch 16 vs 64;\n    larger\
    \ effective batch gives cleaner gradients on competing\n    loss terms.\n  - pre_pca_arm\
    \ \u2208 {pp095_whiten, no_prepca}: per-area PCA at 0.95\n    with post-PCA whitening\
    \ vs no first-stage compression at all.\nResolution-IV fractional design lets\
    \ us read off main effects of all\nfour with the cluster cost of an OFAT screening.\n"
  success_criteria:
  - All 64 cells finish within the 3-hour SLURM cap.
  - val/one_step_mase finite for all cells.
  - At least one cell with decoded_only_pred_loss=true beats its decoded_only=false
    counterpart on val/dynamics_only_one_step_mase.
  - val/trajectory_pred_loss_obs is logged for both decoded_only arms so cross-flag
    comparison is direct.

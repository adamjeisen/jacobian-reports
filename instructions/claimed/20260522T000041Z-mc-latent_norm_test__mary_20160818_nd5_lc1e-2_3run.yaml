kind: mindcontrol
metadata:
  description: "3 cells on Mary-Anesthesia-20160818-02 (awake + maintenance dose,\
    \ ds=1), n_delays=5, loop_closure_weight=1e-2 fixed (the chosen-run hyperparameters\
    \ for this session). Single `variant` axis: {baseline, emanorm, percond_dyn}.\
    \ 20 epochs each. All other knobs match the production nopre_decF_w0_nt99_pred10\
    \ LC\xD7nd sweep on this session. Tracks per-condition Jacobian temporal variation\
    \ each val epoch (val/jac_temporal_cv*).\n"
  hypothesis: "The neural JacobianODE learns near-constant (effectively linear)\n\
    Jacobians on this dataset: temporal CV of Jacobian entries is ~1e-5\nwithin a\
    \ condition. The leading suspect is that the volume-preserving\ndirect-sum encoder\
    \ leaves z_dyn at very small scale (z_dyn holds ~12%\nof variance; the rest is\
    \ rotated into the ignored null), so the\ndynamics MLP \u2014 fed a tiny-scale,\
    \ narrow-range input \u2014 sits in a flat\nregion and emits an essentially affine\
    \ map. If that is the cause,\nEMA latent-normalization (rescaling z_dyn to unit\
    \ scale before the\ndynamics MLP) should restore time-varying Jacobians (val/jac_temporal_cv\n\
    rising well above the baseline's ~0). A per-condition dynamics model is\na complementary\
    \ test: if a single shared near-linear flow is being\nforced to cover both regimes,\
    \ splitting it should also raise\nper-condition Jacobian variation. If neither\
    \ moves the CV, linear\ndynamics genuinely fit this data best.\n"
  success_criteria:
  - All 3 cells run to 20 epochs (or TIMEOUT) within the SLURM cap.
  - val/one_step_mase finite for all 3 cells.
  - val/jac_temporal_cv logged each val epoch for all 3 cells.
  - emanorm and/or percond_dyn show val/jac_temporal_cv clearly above the baseline
    cell (otherwise near-linearity is not a scale or routing artifact).
